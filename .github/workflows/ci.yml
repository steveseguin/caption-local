name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-linux.lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: python -m pip install -r requirements-linux.lock pytest==9.1.1
      - name: Protocol, scheduling and recovery tests
        run: python -m pytest -q
      - name: Audio buffer and worklet tests
        run: node --test tests/audio-buffer.test.cjs tests/local-connection.test.cjs tests/relay-config.test.cjs tests/relay-publisher.test.cjs
      - name: Documentation and source checks
        run: python scripts/check_release.py
      - name: Browser discard and admission recovery
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
          python scripts/browser_discard.py --output /tmp/caption-discard.json
      - name: Build source archive
        run: python scripts/package_release.py
      - name: Validate Compose configurations
        run: |
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.cpu-throughput.yaml config --quiet
          docker compose -f compose.yaml -f compose.gpu.yaml config --quiet
      - name: Build CPU image
        run: docker build -t caption-local:ci .
